name: Daily DSA solutions

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Configure Git identity
        run: |
          git config user.name "nitinsingh2006"
          git config user.email "205589850+nitinsingh2006@users.noreply.github.com"
      - run: python generate_solutions.py
        env:
          XAI_API_KEY: ${{ secrets.DSA }}
      - name: Commit generated solutions
        run: |
          solution_files=$(git status --short -- solutions/ | awk '$1 ~ /A|M|\?\?/ {print substr($0, 4)}')
          commit_count=0

          while IFS= read -r solution_file; do
            [ -n "$solution_file" ] || continue
            git add -- "$solution_file"
            solution_name=$(basename "$solution_file" .md)
            git commit -m "solve: $solution_name"
            commit_count=$((commit_count + 1))
          done <<< "$solution_files"

          # Keep generation failures tracked without mixing them into solution commits.
          if ! git diff --quiet -- failed_items.log || ! git diff --cached --quiet -- failed_items.log; then
            git add -- failed_items.log
            git commit -m "chore: record failed DSA items"
          fi

          echo "Created $commit_count solution commit(s)."
          git push
