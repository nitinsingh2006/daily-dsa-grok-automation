name: Daily DSA solutions

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generate_solutions.py
        env:
          XAI_API_KEY: ${{ secrets.DSA }}
      - name: Commit generated solutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solutions/ failed_items.log
          git diff --cached --quiet || git commit -m "chore: add daily DSA solutions"
          git push
